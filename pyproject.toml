[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhxy-agent"
version = "0.1.0"
description = "梦幻西游五开长期运营 AI Strategy Brain"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "mhxy_agent contributors"}]
dependencies = []

[project.scripts]
mhxy-agent = "mhxy_agent.cli:main"

[tool.setuptools.packages.find]
include = ["mhxy_agent*"]
